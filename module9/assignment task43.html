<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 43 - Grid and Flexbox Landing Page</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* Flexbox for Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: #2c3e50;
      color: #fff;
    }
    .nav-links {
      display: flex;
      gap: 20px;
    }
    .nav-links a { color: #fff; text-decoration: none; }

    /* CSS Grid for Main Layout Cards */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: #ecf0f1;
      padding: 20px;
      text-align: center;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="logo">Brand</div>
    <nav class="nav-links">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main class="grid-container">
    <div class="card">Card Item 1</div>
    <div class="card">Card Item 2</div>
    <div class="card">Card Item 3</div>
  </main>

</body>
</html>
