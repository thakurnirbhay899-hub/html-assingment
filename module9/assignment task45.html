<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 45 - Fully Responsive Final Project</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; line-height: 1.6; }

    /* Header Flexbox */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1abc9c;
      color: white;
      padding: 1rem 2rem;
    }
    .menu {
      display: flex;
      gap: 15px;
    }
    .menu a { color: white; text-decoration: none; }

    /* Main Grid Section */
    .main-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .box-item {
      background: #f9f9f9;
      border: 1px solid #ccc;
      padding: 30px;
      text-align: center;
    }

    /* Responsive Breakpoints */
    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      header {
        flex-direction: column;
        gap: 10px;
      }
    }

    @media (max-width: 480px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <h2>Final Project</h2>
    <nav class="menu">
      <a href="#">Home</a>
      <a href="#">Portfolio</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="main-grid">
    <div class="box-item">Responsive Section 1</div>
    <div class="box-item">Responsive Section 2</div>
    <div class="box-item">Responsive Section 3</div>
  </section>

</body>
</html>
