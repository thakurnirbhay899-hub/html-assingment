<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 41 - Breakpoints</title>
  <style>
    .container {
      width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .box { background: #3498db; padding: 40px; color: white; text-align: center; }

    /* Tablet Breakpoint */
    @media screen and (max-width: 768px) {
      .container {
        width: 100%;
        padding: 0 20px;
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Mobile Breakpoint */
    @media screen and (max-width: 480px) {
      .container {
        grid-template-columns: 1fr;
        padding: 0 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>
  </div>
</body>
</html>
