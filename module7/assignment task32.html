<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Perfectly centred login form using Flexbox in Forest Green by Nirbhay Thakur.">
  <title>Centred Login Form – Nirbhay Thakur</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f291e, #10b981);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 1rem;
    }

    .login {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      padding: 2rem;
      border-radius: 14px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, .3);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .login h1 {
      margin: 0;
      text-align: center;
      color: #0f291e;
      font-size: 1.75rem;
    }

    .login p.subtitle {
      margin: -0.5rem 0 0;
      text-align: center;
      color: #475569;
      font-size: 0.9rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: .3rem;
      font-weight: 600;
      color: #1e293b;
    }

    .field input {
      padding: .7rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
      transition: border-color 0.2s, outline 0.2s;
    }

    .field input:focus {
      outline: 3px solid #a7f3d0;
      border-color: #059669;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: .9rem;
      color: #475569;
    }

    .row a {
      color: #059669;
      text-decoration: none;
      font-weight: 600;
    }

    .row a:hover {
      text-decoration: underline;
    }

    button {
      padding: .8rem;
      border: 0;
      border-radius: 8px;
      background: #0f291e;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #184231;
    }
  </style>
</head>

<body>
  <form class="login" action="#" method="post">
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to Nirbhay Thakur's Portal</p>
    
    <label class="field">
      Email 
      <input type="email" required placeholder="thakurnirbhay899@gmail.com">
    </label>
    
    <label class="field">
      Password 
      <input type="password" required minlength="8" placeholder="••••••••">
    </label>
    
    <div class="row">
      <label><input type="checkbox"> Remember me</label>
      <a href="#">Forgot password?</a>
    </div>
    
    <button type="submit">Log in</button>
  </form>
</body>

</html>
